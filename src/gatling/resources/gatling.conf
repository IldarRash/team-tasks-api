gatling {
  core {
    encoding = "UTF-8"
    shutdownTimeout = 30000
  }
  http {
    # Prevent an unrelated remote warm-up request from contaminating local measurements.
    warmUpUrl = ""
    requestTimeout = 10000
    pooledConnectionIdleTimeout = 30000
  }
  charting {
    # Report group durations for the Task lifecycle transaction rather than a sum of request times.
    useGroupDurationMetric = true
  }
  data {
    console.light = true
    console.writePeriod = 5
  }
}
