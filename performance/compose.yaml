services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: taskdb, POSTGRES_USER: tasks, POSTGRES_PASSWORD: tasks}
    volumes: [native-performance-data:/var/lib/postgresql/data]
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d taskdb"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: ..
      dockerfile: performance/Dockerfile
    image: team-tasks-native-performance
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/taskdb
      DATABASE_USER: tasks
      DATABASE_PASSWORD: tasks
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics
    command: ["-Xms256m", "-Xmx512m"]
    ports: ["127.0.0.1:8084:8080"]
    cpus: 2
    mem_limit: 1g
    depends_on:
      db: {condition: service_healthy}
volumes:
  native-performance-data:
