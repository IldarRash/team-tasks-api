services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d taskdb"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    image: team-tasks-api-native
    command: ["-Xms256m", "-Xmx512m"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/taskdb
      DATABASE_USER: tasks
      DATABASE_PASSWORD: tasks
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
